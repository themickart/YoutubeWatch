<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <title>YoutubeWatch</title>
  <style>:root{color-scheme:dark;font:12px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#e4e4e8;background:#18181b}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden}button,input,a{font:inherit}button,a{color:inherit}button{cursor:pointer}button:disabled{opacity:.3;cursor:default}[hidden]{display:none!important}.app{display:grid;grid-template-rows:44px minmax(0,1fr) 22px;width:100%;height:100%;min-width:0;min-height:0}#video-form{display:flex;align-items:center;gap:5px;padding:6px 8px;min-width:0}input{flex:1;min-width:0;height:30px;border:1px solid #38383f;background:#222226;color:#f0f0f2;border-radius:5px;padding:0 9px;outline:none}input::placeholder{color:#9898a3}input:focus{border-color:#b96d73}input[aria-invalid=true]{border-color:#ed777e}button,a{flex-shrink:0}button:focus-visible,a:focus-visible,#resize-handle:focus-visible{outline:2px solid #ef9198;outline-offset:1px}svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}.load-button,.icon-button{border:0;border-radius:5px;width:30px;height:30px;display:inline-flex;align-items:center;justify-content:center;text-decoration:none;background:transparent;color:#aaaab5;padding:0}.load-button{color:#fff;background:#e44950}.load-button:hover{background:#f15d64}.load-button svg{fill:currentColor;stroke:none;width:17px;height:17px}.icon-button:hover:not(:disabled){color:#fff;background:#303036}.player-shell{position:relative;min-width:0;min-height:0;background:#101012;overflow:hidden}#player-host{position:absolute;inset:0}#player-host iframe{width:100%;height:100%;border:0;display:block}.empty-state{position:absolute;inset:0;width:100%;height:100%;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:10px;border:0;background:transparent;color:#92929c}.empty-state svg{fill:#e76870;stroke:none;width:32px;height:32px}.empty-state span{font-size:11px}.empty-state:hover{color:#dddde4;background:#ffffff03}.status-bar{display:flex;align-items:center;min-width:0;padding-left:8px;gap:4px}#status{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:10px;color:#9696a3}#status[data-state=error]{color:#f3969d}#resize-handle{width:22px;height:22px;display:grid;place-items:center;cursor:nwse-resize;color:#777782;touch-action:none;user-select:none}#resize-handle svg{width:12px;height:12px}body.resizing{cursor:nwse-resize;user-select:none}body.resizing #player-host{pointer-events:none}.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
</style>
</head>
<body>
  <main class="app">
    <form id="video-form" novalidate>
      <label class="sr-only" for="video-url">YouTube video link or video ID</label>
      <input id="video-url" type="text" placeholder="YouTube link" autocomplete="off" spellcheck="false" aria-describedby="status">
      <button class="load-button" type="submit" aria-label="Load video" title="Load video (Enter)"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m9 5 11 7-11 7z"/></svg></button>
      <button id="reload" class="icon-button" type="button" title="Reload video" aria-label="Reload video" disabled><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19 8a8 8 0 1 0 1 7M19 3v6h-6"/></svg></button>
      <a id="external-link" class="icon-button" title="Open on YouTube" aria-label="Open video on YouTube" target="_blank" rel="noopener" hidden><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14 3h7v7m0-7L10 14M10 3H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-5"/></svg></a>
    </form>
    <section class="player-shell" aria-label="Video player">
      <div id="player-host"></div>
      <button id="demo-play" class="empty-state" aria-label="Load the YouTube demo video"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m9 5 11 7-11 7z"/></svg><span>Try demo</span></button>
    </section>
    <div class="status-bar"><span id="status" role="status" aria-live="polite">Paste a link or try the demo</span><span id="resize-handle" role="separator" aria-label="Resize player window" aria-orientation="vertical" tabindex="0" title="Drag to resize; arrow keys also work"><svg viewBox="0 0 12 12" aria-hidden="true"><path d="m3 10 7-7m-3 7 3-3"/></svg></span></div>
  </main>
  <script>const DEMO_URL = "https://www.youtube.com/watch?v=M7lc1UVf-VE";
const VIDEO_ID = /^[A-Za-z0-9_-]{11}$/;

function parseTime(value) {
  if (!value) return 0;
  if (/^\d+$/.test(value)) return Math.min(Number(value), 2147483647);
  const match = /^(?:(\d+)h)?(?:(\d+)m)?(?:(\d+)s)?$/.exec(value);
  if (!match || !match[0]) return 0;
  return Math.min(Number(match[1] || 0) * 3600 + Number(match[2] || 0) * 60 + Number(match[3] || 0), 2147483647);
}

function parseVideo(input) {
  const value = input.trim();
  if (VIDEO_ID.test(value)) return { id: value, start: 0 };
  let url;
  try {
    url = new URL(/^(?:(?:www|m)\.)?(?:youtube\.com|youtu\.be)\//i.test(value) ? `https://${value}` : value);
  } catch {
    throw new Error("Paste a YouTube video link or an 11-character video ID.");
  }
  if (!['https:', 'http:'].includes(url.protocol) || url.username || url.password || url.port) {
    throw new Error("Use a regular YouTube video link.");
  }
  const host = url.hostname.toLowerCase();
  let id;
  if (host === 'youtu.be') {
    const parts = url.pathname.split('/').filter(Boolean);
    if (parts.length === 1) id = parts[0];
  } else if (['youtube.com', 'www.youtube.com', 'm.youtube.com'].includes(host)) {
    if (url.pathname === '/watch') id = url.searchParams.get('v');
    else id = /^\/(?:embed|shorts|live)\/([A-Za-z0-9_-]{11})\/?$/.exec(url.pathname)?.[1];
  } else {
    throw new Error("Only YouTube video links are supported.");
  }
  if (!id || !VIDEO_ID.test(id)) throw new Error("This link has no video ID. Open a video and copy its link.");
  return { id, start: parseTime(url.searchParams.get('t') || url.searchParams.get('start') || new URLSearchParams(url.hash.slice(1)).get('t')) };
}

function embedUrl(video, origin) {
  // Never navigate directly to pasted URLs, including short URLs.
  const url = new URL(`https://www.youtube.com/embed/${video.id}`);
  url.search = new URLSearchParams({ enablejsapi: '1', playsinline: '1', autoplay: '0', rel: '0' });
  if (video.start) url.searchParams.set('start', String(video.start));
  // An opaque Figma sandbox has no HTTP origin; do not invent one.
  if (origin && /^https?:\/\//.test(origin)) url.searchParams.set('origin', new URL(origin).origin);
  return url.href;
}

function playerError(code) {
  const messages = {
    2: "YouTube could not read this video ID. Check the link and try again.",
    5: "YouTube could not play this video. Try reloading it or opening it on YouTube.",
    100: "This video is unavailable, private, or has been removed. Try another link.",
    101: "The owner does not allow embedded playback. Try another video or open it on YouTube.",
    150: "The owner does not allow embedded playback. Try another video or open it on YouTube.",
    153: "YouTube did not receive the required HTTP Referer from the Figma sandbox. With only www.youtube.com allowed, this environment cannot play the embed. Use the arrow beside the link to open it on YouTube."
  };
  return messages[code] || "YouTube could not play this video. Try another link or open it on YouTube.";
}

const $ = id => document.getElementById(id);
let player = null;
let currentVideo = null;
let attempt = 0;
let loadTimer;
let apiPromise;

function setStatus(text, state = 'idle', detail = text) {
  $('status').textContent = text;
  $('status').dataset.state = state;
  $('status').title = detail;
}

function loadAPI() {
  if (window.YT?.Player) return Promise.resolve();
  if (apiPromise) return apiPromise;
  apiPromise = new Promise((resolve, reject) => {
    const script = document.createElement('script');
    const timer = setTimeout(fail, 15000);
    function fail() {
      clearTimeout(timer);
      script.remove();
      apiPromise = null;
      reject(new Error('Player status unavailable. Try reload.'));
    }
    window.onYouTubeIframeAPIReady = () => { clearTimeout(timer); resolve(); };
    script.src = 'https://www.youtube.com/iframe_api';
    script.onerror = fail;
    document.head.appendChild(script);
  });
  return apiPromise;
}

function onPlayerEvent(type, data) {
  if (type === 'ready') {
    // Ready is a successful API handshake, not evidence that playback works.
    if ($('status').dataset.state === 'error') return;
    clearTimeout(loadTimer);
    setStatus('Press play in the video', 'ready');
  } else if (type === 'error') {
    clearTimeout(loadTimer);
    setStatus(data === 153 ? 'Error 153 · missing player referrer' : `YouTube error ${data}`, 'error', playerError(data));
  } else if (type === 'state') {
    const states = { 0: ['Ended', 'ready'], 1: ['Playing', 'playing'], 2: ['Paused', 'ready'], 3: ['Buffering…', 'loading'], 5: ['Press play in the video', 'ready'] };
    // An unstarted event must not erase a preceding 153 error.
    if (states[data] && (data === 1 || $('status').dataset.state !== 'error')) {
      clearTimeout(loadTimer);
      setStatus(...states[data]);
    }
  } else if (type === 'autoplay-blocked') setStatus('Press play in the video', 'ready');
}

async function loadVideo(input) {
  let video;
  try { video = parseVideo(input); }
  catch (error) {
    setStatus(error.message, 'error');
    $('video-url').setAttribute('aria-invalid', 'true');
    $('video-url').focus();
    return;
  }
  $('video-url').removeAttribute('aria-invalid');
  const token = ++attempt;
  clearTimeout(loadTimer);
  if (player) { player.destroy(); player = null; }
  currentVideo = video;
  $('demo-play').hidden = true;
  $('reload').disabled = false;
  $('external-link').href = `https://www.youtube.com/watch?v=${video.id}${video.start ? `&t=${video.start}s` : ''}`;
  $('external-link').hidden = false;
  setStatus('Loading…', 'loading');
  const frame = document.createElement('iframe');
  frame.id = 'youtube-player';
  frame.title = 'YouTube video player';
  frame.allow = 'accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; fullscreen';
  frame.allowFullscreen = true;
  frame.referrerPolicy = 'strict-origin-when-cross-origin';
  frame.src = embedUrl(video, window.location.origin);
  $('player-host').replaceChildren(frame);
  loadTimer = setTimeout(() => {
    if (token === attempt) setStatus('Player did not respond · try reload', 'error');
  }, 20000);
  try {
    await loadAPI();
    if (token !== attempt) return;
    player = new YT.Player(frame, {
      events: {
        onReady: () => { if (token === attempt) onPlayerEvent('ready'); },
        onStateChange: event => { if (token === attempt) onPlayerEvent('state', event.data); },
        onError: event => { if (token === attempt) onPlayerEvent('error', event.data); },
        onAutoplayBlocked: () => { if (token === attempt) onPlayerEvent('autoplay-blocked'); }
      }
    });
  } catch (error) {
    if (token !== attempt) return;
    clearTimeout(loadTimer);
    setStatus(error.message, 'error');
  }
}

$('video-form').addEventListener('submit', event => { event.preventDefault(); loadVideo($('video-url').value); });
$('demo-play').addEventListener('click', () => { $('video-url').value = DEMO_URL; loadVideo(DEMO_URL); });
$('video-url').addEventListener('input', () => $('video-url').removeAttribute('aria-invalid'));
$('reload').addEventListener('click', () => {
  if (currentVideo) loadVideo(`https://www.youtube.com/watch?v=${currentVideo.id}&t=${currentVideo.start}s`);
});

function resize(width, height) {
  width = Math.max(360, Math.min(1200, Math.round(width)));
  height = Math.max(266, Math.min(900, Math.round(height)));
  if (window.parent !== window) parent.postMessage({ pluginMessage: { type: 'resize', width, height } }, '*');
}
let drag;
const handle = $('resize-handle');
handle.addEventListener('pointerdown', event => {
  if (event.button !== 0) return;
  drag = { x: event.screenX, y: event.screenY, width: innerWidth, height: innerHeight };
  handle.setPointerCapture(event.pointerId);
  document.body.classList.add('resizing');
});
handle.addEventListener('pointermove', event => {
  if (drag) resize(drag.width + event.screenX - drag.x, drag.height + event.screenY - drag.y);
});
function endDrag() { drag = null; document.body.classList.remove('resizing'); }
handle.addEventListener('pointerup', endDrag);
handle.addEventListener('pointercancel', endDrag);
handle.addEventListener('lostpointercapture', endDrag);
handle.addEventListener('keydown', event => {
  const step = event.shiftKey ? 40 : 10;
  const offsets = { ArrowLeft: [-step, 0], ArrowRight: [step, 0], ArrowUp: [0, -step], ArrowDown: [0, step] };
  if (!offsets[event.key]) return;
  event.preventDefault();
  resize(innerWidth + offsets[event.key][0], innerHeight + offsets[event.key][1]);
});
</script>
</body>
</html>
