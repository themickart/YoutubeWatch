<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <title>YoutubeWatch</title>
  <style>/* INLINE_STYLES */</style>
</head>
<body>
  <main class="app">
    <form id="video-form" novalidate>
      <label class="sr-only" for="video-url">YouTube video link or video ID</label>
      <input id="video-url" type="text" placeholder="YouTube link" autocomplete="off" spellcheck="false" aria-describedby="status">
      <button class="load-button" type="submit" aria-label="Load video" title="Load video (Enter)"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m9 5 11 7-11 7z"/></svg></button>
      <button id="reload" class="icon-button" type="button" title="Reload video" aria-label="Reload video" disabled><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19 8a8 8 0 1 0 1 7M19 3v6h-6"/></svg></button>
      <a id="external-link" class="icon-button" title="Open on YouTube" aria-label="Open video on YouTube" target="_blank" rel="noopener" hidden><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14 3h7v7m0-7L10 14M10 3H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-5"/></svg></a>
    </form>
    <section class="player-shell" aria-label="Video player">
      <div id="player-host"></div>
      <button id="demo-play" class="empty-state" aria-label="Load the YouTube demo video"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m9 5 11 7-11 7z"/></svg><span>Try demo</span></button>
    </section>
    <div class="status-bar">
      <button id="toolbar-toggle" class="bar-button" type="button" aria-label="Hide video link" aria-expanded="true" aria-controls="video-form" title="Hide video link" hidden><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6 14 6-6 6 6"/></svg></button>
      <span id="status" role="status" aria-live="polite">Paste a link or try the demo</span>
      <div id="volume-controls" hidden>
        <button id="mute-toggle" class="bar-button" type="button" aria-label="Mute" aria-pressed="false" title="Mute"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M11 5 6 9H3v6h3l5 4z"/><path class="sound-waves" d="M15 8a6 6 0 0 1 0 8m3-11a10 10 0 0 1 0 14"/><path class="sound-off" d="m16 9 5 6m0-6-5 6"/></svg></button>
        <label class="sr-only" for="volume">Volume</label>
        <input id="volume" type="range" min="0" max="100" step="1" value="100" aria-valuetext="100%" title="Volume: 100%">
      </div>
      <span id="resize-handle" role="separator" aria-label="Resize player window" aria-orientation="vertical" tabindex="0" title="Drag to resize; arrow keys also work"><svg viewBox="0 0 12 12" aria-hidden="true"><path d="m3 10 7-7m-3 7 3-3"/></svg></span>
    </div>
  </main>
  <script>/* INLINE_SCRIPT */</script>
</body>
</html>
